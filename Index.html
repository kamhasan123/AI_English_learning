<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 selection:bg-emerald-500 selection:text-white">

    <!-- TOP HEADER -->
    <header class="max-w-md mx-auto p-4 flex justify-between items-center border-b border-slate-900">
        <div class="flex items-center gap-3 text-sm">
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">🔥 <strong id="streak-count">1</strong></span>
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">⭐ <strong id="xp-count">10</strong></span>
        </div>
        <div class="text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800/50 px-3 py-1 rounded-full" id="user-tier-badge">A1.1 Absolute Beginner</div>
    </header>

    <!-- MAIN APP CONTENT CONTAINER -->
    <main id="app-view" class="max-w-md mx-auto p-4 pt-2">
        <!-- Dynamic Views Injected Here -->
    </main>

    <!-- BOTTOM APP NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-between max-w-md mx-auto z-50 text-xs">
        <button onclick="switchTab('learn')" id="nav-learn" class="flex flex-col items-center text-emerald-400 transition"><span>📖</span><span>Learn</span></button>
        <button onclick="switchTab('courses')" id="nav-courses" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"><span>🎓</span><span>Courses</span></button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"><span>🏠</span><span>Home</span></button>
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"><span>🔍</span><span>Explore</span></button>
        <button onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition"><span>📈</span><span>Progress</span></button>
    </nav>

    <script>
        // PASTE YOUR GEMINI API KEY HERE:
        const API_KEY = "AQ.Ab8RN6KOx8AOlD7MUaLrFid6JGfBfef7gQOh7ay1ijk_SzHvLg";

        // Persistent User Data Storage
        let currentTier = localStorage.getItem('ai_tier') || "A1.1 Absolute Beginner";
        let currentXP = parseInt(localStorage.getItem('ai_xp')) || 10;
        let streak = parseInt(localStorage.getItem('ai_streak')) || 1;

        document.getElementById('user-tier-badge').innerText = currentTier;
        document.getElementById('xp-count').innerText = currentXP;
        document.getElementById('streak-count').innerText = streak;

        // Navigation Switcher Logic
        function switchTab(tab) {
            ['learn', 'courses', 'home', 'explore', 'progress'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if(btn) btn.className = t === tab ? "flex flex-col items-center text-emerald-400 transition" : "flex flex-col items-center text-slate-400 hover:text-slate-200 transition";
            });

            const view = document.getElementById('app-view');

            if (tab === 'home' || tab === 'learn') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Training Modes</h1>
                        <p class="text-xs text-slate-400">Select an exercise to practice your communication skills.</p>
                    </div>
                    <div class="space-y-3">
                        <div onclick="openExercise('Word Mode', 'Learn and master new vocabulary terms with adaptive difficulty.')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-emerald-500/50 transition shadow-lg">
                            <h2 class="font-bold text-sm text-emerald-400">🔤 Word Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Learn basic vocabulary and advanced word decks.</p>
                        </div>
                        <div onclick="openExercise('Sentence Mode', 'Build strong sentence structures and complete grammar exercises.')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-emerald-500/50 transition shadow-lg">
                            <h2 class="font-bold text-sm text-emerald-400">📝 Sentence & Homework Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Build a solid foundation through practical writing tasks.</p>
                        </div>
                        <div onclick="openExercise('Conversation Mode', 'Engage in a live back-and-forth dialogue simulation with instant AI feedback.')" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-emerald-500/50 transition shadow-lg">
                            <h2 class="font-bold text-sm text-emerald-400">💬 Dialogue & Call Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Practice essential daily conversations and voice dialogue.</p>
                        </div>
                        <div onclick="openHandwritingMode()" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl cursor-pointer hover:border-emerald-500/50 transition shadow-lg">
                            <h2 class="font-bold text-sm text-emerald-400">📸 Handwriting Paper Checker</h2>
                            <p class="text-xs text-slate-400 mt-1">Upload a photo of your handwritten notes to check grammar and spelling.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'courses') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Level Courses</h1>
                        <p class="text-xs text-slate-400">Systematic path from beginner to proficient fluency.</p>
                    </div>
                    <div class="space-y-3">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">A1.1</span>
                            <h2 class="font-bold text-sm mt-1">Absolute Beginner 1</h2>
                            <p class="text-xs text-slate-400">Start your language learning journey here.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">A1.2</span>
                            <h2 class="font-bold text-sm mt-1">Absolute Beginner 2</h2>
                            <p class="text-xs text-slate-400">A course to finish learning the basics.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <span class="text-[10px] bg-blue-950 text-blue-400 px-2 py-0.5 rounded font-mono">B1.1</span>
                            <h2 class="font-bold text-sm mt-1">Intermediate 1</h2>
                            <p class="text-xs text-slate-400">A course for intermediate students expanding skills.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <span class="text-[10px] bg-purple-950 text-purple-400 px-2 py-0.5 rounded font-mono">C1.1</span>
                            <h2 class="font-bold text-sm mt-1">Advanced 1</h2>
                            <p class="text-xs text-slate-400">Master high-level sentence structures and nuances.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'progress') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Your Progress</h1>
                        <p class="text-xs text-slate-400">Tracking your evolution and difficulty scaling.</p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4 shadow-xl">
                        <div>
                            <span class="text-xs text-slate-400">Current Assigned Tier</span>
                            <p class="text-lg font-bold text-emerald-400">${currentTier}</p>
                        </div>
                        <div>
                            <span class="text-xs text-slate-400">Total Mastery XP</span>
                            <p class="text-lg font-bold text-amber-400">${currentXP} Points</p>
                        </div>
                        <p class="text-[11px] text-slate-400 border-t border-slate-800 pt-3">As you finish exercises successfully, your score increases, automatically pushing your difficulty tier upward!</p>
                    </div>
                `;
            } else {
                view.innerHTML = `
                    <div class="text-center py-20">
                        <h1 class="text-lg font-bold text-white">Explore Hub</h1>
                        <p class="text-xs text-slate-400 mt-1">Discover dynamic real-world scenarios and roleplay prompts soon.</p>
                    </div>
                `;
            }
        }

        // Open Exercise Screen
        function openExercise(title, desc) {
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <button onclick="switchTab('home')" class="text-xs text-emerald-400 mb-3 flex items-center gap-1 font-semibold">← Back to Dashboard</button>
                <h1 class="text-lg font-bold text-white mb-1">${title}</h1>
                <p class="text-xs text-slate-400 mb-3">${desc}</p>
                
                <div id="ai-output-box" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-sm mb-3 min-h-[140px] text-slate-200 overflow-y-auto">
                    Loading your custom exercise generated by AI based on your ${currentTier} level...
                </div>

                <textarea id="user-input" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white mb-3 focus:outline-none focus:border-emerald-500 shadow-inner" placeholder="Type your response or answers here..." rows="3"></textarea>

                <button onclick="submitUserAnswer('${title}')" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded-xl text-white text-sm transition shadow-lg">Submit Answer & Advance</button>
            `;
            fetchInitialExercise(title);
        }

        // Handwriting Mode Screen
        function openHandwritingMode() {
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <button onclick="switchTab('home')" class="text-xs text-emerald-400 mb-3 flex items-center gap-1 font-semibold">← Back to Dashboard</button>
                <h1 class="text-lg font-bold text-white mb-1">📸 Handwriting Paper Checker</h1>
                <p class="text-xs text-slate-400 mb-3">Upload a photo of your handwritten paper. The AI will read it, spot grammar/spelling errors, explain why they occurred, and show how to fix them.</p>
                
                <div class="mb-4">
                    <input type="file" id="handwriting-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-950 file:text-emerald-400 hover:file:bg-emerald-900 transition">
                </div>

                <div id="ai-output-box" class="bg-slate-900 border border-slate-800 p-4 rounded-2xl text-sm mb-3 min-h-[140px] text-slate-200 overflow-y-auto">
                    Upload an image above and click check to analyze your handwriting.
                </div>

                <button onclick="analyzeHandwriting()" id="check-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 rounded-xl text-white text-sm transition shadow-lg">Check My Handwriting</button>
            `;
        }

        async function callGeminiAPI(promptText, partsPayload = null) {
            if (API_KEY === "" || API_KEY === "YOUR_GEMINI_API_KEY_HERE") {

                return "⚠️ Please insert your valid Gemini API Key into the script tag inside the code!";
            }
            https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}

            
            let contents = [{ parts: [{ text: promptText }] }];
            if (partsPayload) {
                contents = [{ parts: partsPayload }];
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (err) {
                return "Error connecting to the AI service. Please check your internet connection.";
            }
        }

        async function fetchInitialExercise(mode) {
            const prompt = `Act as an expert English language tutor. The student is at tier: ${currentTier}. Give them a brief, high-value practice exercise for "${mode}" (teaching new words, sentence structure, or conversational prompts depending on the mode). Keep it clean and direct.`;
            document.getElementById('ai-output-box').innerText = await callGeminiAPI(prompt);
        }

        async function submitUserAnswer(mode) {
            const answer = document.getElementById('user-input').value.trim();
            const outputBox = document.getElementById('ai-output-box');
            const btn = document.getElementById('submit-btn');

            if (!answer) {
                alert("Please type your response first!");
                return;
            }

            outputBox.innerText = "Evaluating your response, correcting grammar, and scaling difficulty...";
            btn.disabled = true;

            const prompt = `The student is working on "${mode}" at tier ${currentTier}. Their submission: "${answer}".
            Task:
            1. Review their answer, correct any mistakes gently.
            2. Provide praise and explain any new vocabulary or rules.
            3. Give them a NEW, slightly harder exercise challenge to progress further.`;

            outputBox.innerText = await callGeminiAPI(prompt);
            document.getElementById('user-input').value = "";
            btn.disabled = false;

            currentXP += 10;
            if (currentXP > 40 && currentTier.includes("A1.1")) currentTier = "A1.2 Absolute Beginner";
            else if (currentXP > 90 && currentTier.includes("A1.2")) currentTier = "B1.1 Intermediate 1";
            else if (currentXP > 150) currentTier = "C1.1 Advanced 1";

            localStorage.setItem('ai_tier', currentTier);
            localStorage.setItem('ai_xp', currentXP);
            document.getElementById('user-tier-badge').innerText = currentTier;
            document.getElementById('xp-count').innerText = currentXP;
        }

        async function analyzeHandwriting() {
            const fileInput = document.getElementById('handwriting-file');
            const outputBox = document.getElementById('ai-output-box');
            const btn = document.getElementById('check-btn');
            
            if (fileInput.files.length === 0) {
                alert("Please select an image file of your handwriting first!");
                return;
            }

            const file = fileInput.files[0];
            outputBox.innerText = "Reading your handwriting and analyzing grammar and spelling...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Image = reader.result.split(',')[1];
                const mimeType = file.type;

                const prompt = "Analyze the handwriting in this image. 1. Transcribe what is written. 2. Identify all spelling, punctuation, and grammar mistakes. 3. Explain clearly why each mistake happened. 4. Provide the correct version and show how to fix it.";
                
                const parts = [
                    { text: prompt },
                    { inlineData: { mimeType: mimeType, data: base64Image } }
                ];

                const resultText = await callGeminiAPI(prompt, parts);
                outputBox.innerText = resultText;
                btn.disabled = false;
            };
        }

        // Initialize default view on load
        switchTab('home');
    </script>
</body>
</html>
