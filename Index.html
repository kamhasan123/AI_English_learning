<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 bg-emerald-500 selection:bg-emerald-500 selection:text-white">

    <!-- TOP HEADER -->
    <header class="max-w-md mx-auto p-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3 text-sm">
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-tier-badge">⭐ A1.1 Absolute Beginner</span>
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-xp-count">🔥 10XP</span>
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-streak-count">⚡ Streak: 1</span>
        </div>
    </header>

    <!-- MAIN APP CONTENT CONTAINER -->
    <main id="app-view" class="max-w-md mx-auto p-4 pt-2">
        <!-- Dynamic Views Injected Here -->
    </main>

    <!-- BOTTOM APP NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 p-3 flex justify-around">
        <button onclick="switchTab('learn')" id="nav-learn" class="flex flex-col items-center text-emerald-400 text-xs">Learn</button>
        <button onclick="switchTab('courses')" id="nav-courses" class="flex flex-col items-center text-slate-400 text-xs">Courses</button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-slate-400 text-xs">Home</button>
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-slate-400 text-xs">Explore</button>
        <button onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center text-slate-400 text-xs">Progress</button>
    </nav>

    <script>
        const API_KEY = "AQ.Ab8RN6LIg-sEaI93WJOZEGcM8VzH9td6sKKJBUMEtwKp4vU4GQ";

        // Persistent User Data Storage
        let currentUser = localStorage.getItem('ai_tier') || 'A1.1 Absolute Beginner';
        let currentXP = parseInt(localStorage.getItem('ai_xp') || 10);
        let streak = parseInt(localStorage.getItem('ai_streak') || 1);

        document.getElementById('user-tier-badge').innerText = currentUser;
        document.getElementById('user-xp-count').innerText = currentXP + 'XP';
        document.getElementById('user-streak-count').innerText = '⚡ Streak: ' + streak;

        // Navigation Switcher Logic
        function switchTab(tab) {
            ['learn', 'courses', 'home', 'explore', 'progress'].forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if (btn) btn.className = 'flex flex-col items-center text-slate-400 text-xs';
            });
            const activeBtn = document.getElementById('nav-' + tab);
            if (activeBtn) activeBtn.className = 'flex flex-col items-center text-emerald-400 text-xs font-semibold';

            const view = document.getElementById('app-view');
            
            if (tab === 'home' || tab === 'learn') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Training Modes</h1>
                        <p class="text-xs text-slate-400">Select an exercise to practice your communication skills.</p>
                    </div>
                    <div class="space-y-3">
                        <div onclick="openExercise('Word Mode', 'Learn and master new vocabulary terms with adaptive difficulty.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">📖 Word Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Learn basic vocabulary and advanced word decks.</p>
                        </div>
                        <div onclick="openExercise('Sentence & Homework Mode', 'Build a solid foundation through practical writing tasks.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">📝 Sentence & Homework Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Build strong sentence structures and complete grammar exercises.</p>
                        </div>
                        <div onclick="openExercise('Dialogue & Call Mode', 'Engage in a live back-and-forth dialogue simulation with instant AI feedback.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">🗣️ Dialogue & Call Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Engage in live interactive conversations and voice dialogue.</p>
                        </div>
                        <div onclick="openHandwritingMode()" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">✍️ Handwriting Paper Checker</h2>
                            <p class="text-xs text-slate-400 mt-1">Upload a photo of your handwritten notes to check grammar and spelling.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'courses') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Level Courses</h1>
                        <p class="text-xs text-slate-400">Systematic path from beginner to proficient fluency.</p>
                    </div>
                    <div class="space-y-3">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">A1.1</span>
                            <h2 class="font-bold text-white mt-1">Absolute Beginner 1</h2>
                            <p class="text-xs text-slate-400">Start your language learning journey here.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">A1.2</span>
                            <h2 class="font-bold text-white mt-1">Absolute Beginner 2</h2>
                            <p class="text-xs text-slate-400">A course to finish learning the basics.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[10px] bg-blue-950 text-blue-400 px-2 py-0.5 rounded border border-blue-800">B1.1</span>
                            <h2 class="font-bold text-white mt-1">Intermediate 1</h2>
                            <p class="text-xs text-slate-400">A course for intermediate students expanding skills.</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <span class="text-[10px] bg-purple-950 text-purple-400 px-2 py-0.5 rounded border border-purple-800">C1.1</span>
                            <h2 class="font-bold text-white mt-1">Advanced 1</h2>
                            <p class="text-xs text-slate-400">Master high-level sentence structures and nuances.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'progress') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Your Progress</h1>
                        <p class="text-xs text-slate-400">Tracking your evolution and difficulty scaling.</p>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                        <p class="text-xs text-slate-400">Current Assigned Tier</p>
                        <h2 class="text-lg font-bold text-emerald-400" id="current-tier-display">${currentUser}</h2>
                        <div class="mt-4 border-t border-slate-800 pt-3">
                            <p class="text-xs text-slate-400">Total Mastery XP</p>
                            <h3 class="text-xl font-bold text-white" id="total-xp-display">${currentXP} Points</h3>
                        </div>
                    </div>
                `;
            } else {
                view.innerHTML = `
                    <div class="text-center py-20">
                        <h1 class="text-lg font-bold text-white">Explore Hub</h1>
                        <p class="text-xs text-slate-400 mt-1">Discover dynamic real-world dialogue challenges.</p>
                    </div>
                `;
            }
        }

        // Open Exercise Screen
        function openExercise(title, desc) {
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <button onclick="switchTab('home')" class="text-xs text-emerald-400 mb-3">&larr; Back to Dashboard</button>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <h2 class="font-bold text-white text-lg">${title}</h2>
                    <p class="text-xs text-slate-400 mt-1">${desc}</p>
                    
                    <div id="ai-output-box" class="mt-4 bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-slate-300 min-h-[100px]">
                        Loading your custom exercise generated by AI based on your ${currentUser} beginner level...
                    </div>

                    <textarea id="user-input-answer" class="mt-3 w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Type your response or answers here..."></textarea>
                    
                    <button onclick="submitUserAnswer('${title}')" id="submit-btn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-sm transition">Submit Answer & Advance</button>
                </div>
            `;
            fetchInitialExercise(title);
        }

        // Handwriting Mode Screen
        function openHandwritingMode() {
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <button onclick="switchTab('home')" class="text-xs text-emerald-400 mb-3">&larr; Back to Dashboard</button>
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <h2 class="font-bold text-white text-lg">Handwriting Paper Checker</h2>
                    <p class="text-xs text-slate-400 mt-1">Upload a photo of your handwritten notes. The AI will read it, spot grammar/spelling errors, explain why they occurred, and show how to fix them.</p>
                    
                    <input type="file" id="handwriting-file" accept="image/*" class="mt-4 w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-950 file:text-emerald-400 hover:file:bg-emerald-900">
                    
                    <div id="ai-output-box" class="mt-4 bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-slate-300 min-h-[100px]">
                        Upload an image above and click check to analyze your handwriting.
                    </div>

                    <button onclick="analyzeHandwriting()" id="check-btn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-sm transition">Check My Handwriting</button>
                </div>
            `;
        }

        async function callGeminiAPI(promptText, partsPayload = null) {
            if (!API_KEY) {
                return "⚠️ Please insert your valid Gemini API key into the script tag inside the code!";
            }
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            let contents = [{ parts: [{ text: promptText }] }];
            if (partsPayload) {
                contents = [{ parts: partsPayload }];
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Error parsing response from AI service.";
                }
            } catch (err) {
                return "Error connecting to the AI service. Please check your internet connection.";
            }
        }

        async function fetchInitialExercise(title) {
            const prompt = `Act as an expert English language tutor. The student is at tier ${currentUser}. Give them a starting exercise or vocabulary challenge for "${title}" to solve. Keep it encouraging and clear.`;
            const outputBox = document.getElementById('ai-output-box');
            outputBox.innerText = await callGeminiAPI(prompt);
        }

        async function submitUserAnswer(title) {
            const answer = document.getElementById('user-input-answer').value.trim();
            const outputBox = document.getElementById('ai-output-box');
            const btn = document.getElementById('submit-btn');

            if (!answer) {
                alert("Please type your response first!");
                return;
            }

            outputBox.innerText = "Evaluating your response, correcting grammar, and scaling difficulty...";
            btn.disabled = true;

            const prompt = `The student is working on "${title}" mode at tier ${currentUser}. The student submitted this response: "${answer}". 
            Task:
            1. Review their answer, correct any mistakes gently.
            2. Provide praise and explain any new vocabulary or rules.
            3. Give them a NEW, slightly higher exercise challenge to progress further.`;

            outputBox.innerText = await callGeminiAPI(prompt);
            btn.disabled = false;
            document.getElementById('user-input-answer').value = '';

            // Increment XP and progression tracking
            currentXP += 10;
            if (currentXP >= 40 && currentUser.includes("A1.1")) currentUser = "A1.2 Absolute Beginner 2";
            else if (currentXP >= 80 && currentUser.includes("A1.2")) currentUser = "B1.1 Intermediate 1";
            else if (currentXP >= 150) currentUser = "C1.1 Advanced 1";

            localStorage.setItem('ai_tier', currentUser);
            localStorage.setItem('ai_xp', currentXP);
            document.getElementById('user-tier-badge').innerText = currentUser;
            document.getElementById('user-xp-count').innerText = currentXP + 'XP';
        }

        async function analyzeHandwriting() {
            const fileInput = document.getElementById('handwriting-file');
            const outputBox = document.getElementById('ai-output-box');
            const btn = document.getElementById('check-btn');

            if (fileInput.files.length === 0) {
                alert("Please select an image file of your handwriting first!");
                return;
            }

            const file = fileInput.files[0];
            outputBox.innerText = "Reading your handwriting and analyzing grammar and spelling...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Image = reader.result.split(',')[1];
                const mimeType = file.type;

                const prompt = "Analyze the handwriting in this image. Transcribe what was written, identify spelling/grammar mistakes, and give constructive corrections.";
                const parts = [
                    { text: prompt },
                    { inlineData: { mimeType: mimeType, data: base64Image } }
                ];

                const resultText = await callGeminiAPI(prompt, parts);
                outputBox.innerText = resultText;
                btn.disabled = false;
            };
        }

        // Initialize default view on load
        switchTab('home');
    </script>
</body>
</html>
