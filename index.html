<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Renders AI markdown properly -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 selection:bg-emerald-500 selection:text-white">

    <!-- TOP HEADER -->
    <header class="max-w-md mx-auto p-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3 text-sm">
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-tier-badge">⭐ A1.1</span>
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-xp-count">🔥 10XP</span>
            <span class="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 font-semibold" id="user-streak-count">⚡ Streak: 1</span>
        </div>
    </header>

    <!-- MAIN APP CONTENT CONTAINER -->
    <main id="app-view" class="max-w-md mx-auto p-4 pt-2">
        <!-- Dynamic Views Injected Here -->
    </main>

    <!-- BOTTOM APP NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 p-3 flex justify-around">
        <button onclick="switchTab('learn')" id="nav-learn" class="flex flex-col items-center text-emerald-400 text-xs">Learn</button>
        <button onclick="switchTab('courses')" id="nav-courses" class="flex flex-col items-center text-slate-400 text-xs">Courses</button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-slate-400 text-xs">Home</button>
        <button onclick="switchTab('progress')" id="nav-progress" class="flex flex-col items-center text-slate-400 text-xs">Progress</button>
    </nav>

    <script>
        let currentUser = localStorage.getItem('ai_tier') || 'A1.1 Absolute Beginner';
        let currentXP = parseInt(localStorage.getItem('ai_xp') || 10);
        let streak = parseInt(localStorage.getItem('ai_streak') || 1);

        document.getElementById('user-tier-badge').innerText = currentUser.split(' ')[0];
        document.getElementById('user-xp-count').innerText = currentXP + 'XP';

        // --- TEXT TO SPEECH ENGINE ---
        function speakText(text) {
            window.speechSynthesis.cancel(); 
            const cleanText = text.replace(/[*#_`~]/g, ''); 
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.95; 
            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            window.speechSynthesis.cancel();
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            stopSpeaking();
            ['learn', 'courses', 'home', 'progress'].forEach(t => {
                const btn = document.getElementById('nav-' + t);
                if (btn) btn.className = 'flex flex-col items-center text-slate-400 text-xs';
            });
            const activeBtn = document.getElementById('nav-' + tab);
            if (activeBtn) activeBtn.className = 'flex flex-col items-center text-emerald-400 text-xs font-semibold';

            const view = document.getElementById('app-view');
            
            if (tab === 'home' || tab === 'learn') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Training Modes</h1>
                        <p class="text-xs text-slate-400">Select an exercise to practice your communication skills.</p>
                    </div>
                    <div class="space-y-3">
                        <div onclick="openLearningView('Word Mode', 'Learn new vocabulary.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">📖 Word Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Learn basic vocabulary and advanced word decks.</p>
                        </div>
                        <div onclick="openLearningView('Sentence Mode', 'Build strong sentence structures.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <h2 class="font-bold text-emerald-400">📝 Sentence Mode</h2>
                            <p class="text-xs text-slate-400 mt-1">Practice writing and grammar.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'courses') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Level Courses</h1>
                        <p class="text-xs text-slate-400">Systematic path from beginner to proficient fluency.</p>
                    </div>
                    <div class="space-y-3">
                        <div onclick="openLearningView('A1.1 Lesson', 'Absolute Beginner fundamentals.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">A1.1</span>
                            <h2 class="font-bold text-white mt-1">Absolute Beginner 1</h2>
                            <p class="text-xs text-slate-400">Start your language learning journey here.</p>
                        </div>
                        <div onclick="openLearningView('A1.2 Lesson', 'Building on the basics.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">A1.2</span>
                            <h2 class="font-bold text-white mt-1">Absolute Beginner 2</h2>
                            <p class="text-xs text-slate-400">A course to finish learning the basics.</p>
                        </div>
                        <div onclick="openLearningView('B1.1 Lesson', 'Intermediate grammar and vocab.')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl cursor-pointer hover:border-emerald-500 transition">
                            <span class="text-[10px] bg-blue-950 text-blue-400 px-2 py-0.5 rounded border border-blue-800">B1.1</span>
                            <h2 class="font-bold text-white mt-1">Intermediate 1</h2>
                            <p class="text-xs text-slate-400">A course for intermediate students expanding skills.</p>
                        </div>
                    </div>
                `;
            } else if (tab === 'progress') {
                view.innerHTML = `
                    <div class="mb-4">
                        <h1 class="text-xl font-bold text-white">Your Progress</h1>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                        <p class="text-xs text-slate-400">Current Assigned Tier</p>
                        <h2 class="text-lg font-bold text-emerald-400">${currentUser}</h2>
                        <div class="mt-4 border-t border-slate-800 pt-3">
                            <p class="text-xs text-slate-400">Total Mastery XP</p>
                            <h3 class="text-xl font-bold text-white">${currentXP} Points</h3>
                        </div>
                    </div>
                `;
            }
        }

        // --- SHARED LEARNING VIEW (Avatar & Chat) ---
        function openLearningView(title, desc) {
            const view = document.getElementById('app-view');
            view.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <button onclick="switchTab('home')" class="text-xs text-emerald-400">&larr; Leave Session</button>
                    <button onclick="stopSpeaking()" class="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400 hover:text-white">🔇 Mute Avatar</button>
                </div>
                
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                    <h2 class="font-bold text-white text-lg">${title}</h2>
                    
                    <div class="flex gap-3 mt-4 items-start">
                        <div class="w-10 h-10 bg-emerald-900 rounded-full flex items-center justify-center text-xl border-2 border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.3)] shrink-0">
                            👩‍🏫
                        </div>
                        <div id="ai-output-box" class="bg-slate-800 border border-slate-700 p-3 rounded-lg rounded-tl-none text-sm text-slate-200 w-full prose prose-invert prose-sm">
                            <span class="animate-pulse">Teacher is thinking...</span>
                        </div>
                    </div>

                    <textarea id="user-input-answer" class="mt-6 w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="Type your response to the teacher here..."></textarea>
                    
                    <button onclick="submitUserAnswer('${title}')" id="submit-btn" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-lg text-sm transition">Submit Answer</button>
                </div>
            `;
            fetchInitialExercise(title);
        }

        // --- SECURE API CALL (Talking to your new backend) ---
        async function callGeminiAPI(promptText) {
            try {
                const response = await fetch('/api/Chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ promptText: promptText })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    return "Error: " + data.error;
                }
                
                return data.result;
            } catch (err) {
                return "Error connecting to the server. Check your connection.";
            }
        }

        async function fetchInitialExercise(title) {
            const prompt = `Act as a friendly, spoken-word English language tutor. Introduce a short lesson or question for "${title}" for a ${currentUser} student. Keep it conversational, short, and under 3 sentences.`;
            const result = await callGeminiAPI(prompt);
            
            document.getElementById('ai-output-box').innerHTML = marked.parse(result);
            speakText(result); 
        }

        async function submitUserAnswer(title) {
            const answer = document.getElementById('user-input-answer').value.trim();
            const outputBox = document.getElementById('ai-output-box');
            const btn = document.getElementById('submit-btn');

            if (!answer) return;

            outputBox.innerHTML = '<span class="animate-pulse">Teacher is evaluating your answer...</span>';
            btn.disabled = true;

            const prompt = `The student is at tier ${currentUser} doing "${title}". They answered: "${answer}". 
            1. Review and gently correct mistakes. 
            2. Keep it conversational, like a real teacher speaking to them.
            3. Ask a follow-up question. Limit to 4 sentences.`;

            const result = await callGeminiAPI(prompt);
            
            outputBox.innerHTML = marked.parse(result);
            speakText(result); 
            
            btn.disabled = false;
            document.getElementById('user-input-answer').value = '';

            // Give XP
            currentXP += 10;
            localStorage.setItem('ai_xp', currentXP);
            document.getElementById('user-xp-count').innerText = currentXP + 'XP';
        }

        // Initialize default view
        switchTab('home');
    </script>
</body>
</html>
